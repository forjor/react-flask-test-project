services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - cat-data:/app/data
    environment:
      - DB_PATH=/app/data/cats.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cat-data:
