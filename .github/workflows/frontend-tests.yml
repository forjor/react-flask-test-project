name: Frontend Tests & Recordings

on:
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    name: Run frontend tests and capture recordings
    # Only run for PRs opened from test/* branches
    if: startsWith(github.head_ref, 'test/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post the PR comment and upload issue assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project dependencies
        run: make install-frontend install-backend

      - name: Install Playwright browsers
        run: make install-playwright-browsers

      - name: Run frontend tests
        id: tests
        run: make test-frontend
        env:
          CI: true

      - name: Run demo
        if: always()
        id: demo
        run: make demo
        env:
          CI: true

      - name: Upload demo video and post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LOCAL_VIDEO_PATH="artifacts/demo/demo.webm"
          ASSET_NAME="pr-${PR_NUMBER}-demo.webm"

          if [ ! -f "$LOCAL_VIDEO_PATH" ]; then
            echo "No demo video found, skipping PR comment."
            exit 0
          fi

          # Compress video for faster loading
          COMPRESSED="/tmp/${ASSET_NAME}"
          ffmpeg -i "$LOCAL_VIDEO_PATH" \
            -c:v libvpx-vp9 -b:v 600k \
            -c:a libopus -b:a 64k \
            -vf "scale=1280:-2" \
            "$COMPRESSED" 2>/dev/null \
            || cp "$LOCAL_VIDEO_PATH" "$COMPRESSED"

          # Upload to GitHub's issue assets endpoint — this is what the web UI drag-drop uses and
          # is the only route that produces a https://github.com/user-attachments/assets/ URL,
          # which GitHub will render as an inline video player in PR comments.
          echo "Uploading video to GitHub issue assets API..."
          UPLOAD_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: video/webm" \
            "https://uploads.github.com/repos/$REPO/issues/$PR_NUMBER/assets?name=$ASSET_NAME" \
            --data-binary @"$COMPRESSED")
          echo "Upload response: $UPLOAD_RESPONSE"

          VIDEO_URL=$(echo "$UPLOAD_RESPONSE" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    print(d.get('asset_url') or d.get('url') or d.get('browser_download_url') or '')
except:
    print('')
" 2>/dev/null)
          echo "Extracted video URL: $VIDEO_URL"

          # Status line
          if [ "$TESTS_OUTCOME" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="Tests passed"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="Tests failed"
          fi

          # Build and post comment — embed inline if upload succeeded, otherwise link to the run
          {
            echo "## ${STATUS_ICON} Demo Recording — ${STATUS_TEXT}"
            echo ""
            if [ -n "$VIDEO_URL" ]; then
              echo "<video src=\"${VIDEO_URL}\" controls muted width=\"800\"></video>"
              echo ""
              echo "[Direct link](${VIDEO_URL}) &nbsp;|&nbsp; [Run #${RUN_NUMBER}](${RUN_URL})"
            else
              echo "> Video upload failed — see [Run #${RUN_NUMBER}](${RUN_URL}) for the recording artifact."
            fi
          } > /tmp/pr_comment.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/pr_comment.md
