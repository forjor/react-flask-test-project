name: Frontend Tests & Recordings

on:
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    name: Run frontend tests and capture recordings
    # Only run for PRs opened from test/* branches
    if: startsWith(github.head_ref, 'test/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project dependencies
        run: make install-frontend install-backend

      - name: Install Playwright browsers
        run: make install-playwright-browsers

      - name: Run frontend tests
        id: tests
        run: make test-frontend
        env:
          CI: true

      - name: Package recordings
        if: always()
        run: make package-recordings

      - name: Upload test videos
        if: always()
        id: videos
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: frontend/test-results/**/*.webm
          if-no-files-found: warn

      - name: Upload recordings tarball
        if: always()
        id: recordings
        uses: actions/upload-artifact@v4
        with:
          name: recordings-tarball
          path: artifacts/recordings-*.tar.gz
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        id: playwright-report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn

      - name: Post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            BADGE="✅ All tests passed"
          else
            BADGE="❌ Tests failed"
          fi

          # Build a row per recorded video
          VIDEO_ROWS=""
          while IFS= read -r video; do
            dir=$(basename "$(dirname "$video")")
            name="${dir%-chromium}"
            VIDEO_ROWS="${VIDEO_ROWS}| \`${name}\` |
"
          done < <(find frontend/test-results -name "*.webm" 2>/dev/null | sort)

          cat > /tmp/pr-comment.md <<COMMENT
          ## 🎥 Frontend Tests — ${BADGE}

          **Branch:** \`${{ github.head_ref }}\` → \`main\`
          **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Recorded tests

          | Test |
          |------|
          ${VIDEO_ROWS}
          ### Downloads

          | Artifact | Link |
          |----------|------|
          | 📹 Individual videos (.webm) | [Download](${{ steps.videos.outputs.artifact-url }}) |
          | 📦 Recordings tarball | [Download](${{ steps.recordings.outputs.artifact-url }}) |
          | 📊 Playwright HTML report | [Download](${{ steps.playwright-report.outputs.artifact-url }}) |
          COMMENT

          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/pr-comment.md
