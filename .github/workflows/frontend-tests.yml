name: Frontend Tests & Recordings

on:
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    name: Run frontend tests and capture recordings
    # Only run for PRs opened from test/* branches
    if: startsWith(github.head_ref, 'test/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # REQUIRED to create a release and upload the video asset
      pull-requests: write # Required to post the PR comment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project dependencies
        run: make install-frontend install-backend

      - name: Install Playwright browsers
        run: make install-playwright-browsers

      - name: Run frontend tests
        id: tests
        run: make test-frontend
        env:
          CI: true

      - name: Run demo
        if: always()
        id: demo
        run: make demo
        env:
          CI: true

      - name: Package recordings
        if: always()
        run: make package-recordings

      - name: Upload test videos
        if: always()
        id: videos
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: frontend/test-results/**/*.webm
          if-no-files-found: warn

      - name: Upload recordings tarball
        if: always()
        id: recordings
        uses: actions/upload-artifact@v4
        with:
          name: recordings-tarball
          path: artifacts/recordings-*.tar.gz
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        id: playwright-report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn

      - name: Upload demo video artifact
        if: always()
        id: demo-artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: artifacts/demo/demo.webm
          if-no-files-found: warn

      - name: Upload demo video to release and post comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LOCAL_VIDEO_PATH: "artifacts/demo/demo.webm"
          RELEASE_TAG: "automated-pr-assets"
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            BADGE="✅ All tests passed"
          else
            BADGE="❌ Tests failed"
          fi

          EMBED_URL=""
          FALLBACK_URL=""
          if [ -f "$LOCAL_VIDEO_PATH" ]; then
            # Compress to reduce file size for faster loading
            COMPRESSED="artifacts/demo/demo-upload.webm"
            ffmpeg -i "$LOCAL_VIDEO_PATH" \
              -c:v libvpx-vp9 -b:v 600k \
              -c:a libopus -b:a 64k \
              -vf "scale=1280:-2" \
              "$COMPRESSED" 2>/dev/null \
              && LOCAL_VIDEO_PATH="$COMPRESSED"

            ASSET_NAME="pr-${PR_NUMBER}-demo.webm"
            cp "$LOCAL_VIDEO_PATH" "$ASSET_NAME"

            # Upload to release as a downloadable backup
            gh release view "$RELEASE_TAG" > /dev/null 2>&1 || \
              gh release create "$RELEASE_TAG" \
                --title "Automated PR Assets" \
                --notes "Storage locker for automated PR videos and images." \
                --prerelease
            gh release upload "$RELEASE_TAG" "$ASSET_NAME" --clobber
            FALLBACK_URL="https://github.com/$REPO/releases/download/$RELEASE_TAG/$ASSET_NAME"

            # Upload via GitHub's issue asset API to get a user-attachments URL.
            # GitHub PR comments only render <video> tags for user-attachments URLs;
            # release asset URLs are stripped by the markdown renderer.
            UPLOAD_RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: video/webm" \
              "https://uploads.github.com/repos/$REPO/issues/$PR_NUMBER/assets?name=$ASSET_NAME" \
              --data-binary @"$ASSET_NAME")

            EMBED_URL=$(echo "$UPLOAD_RESPONSE" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('asset_url',''))" 2>/dev/null || echo "")
          else
            echo "::warning::artifacts/demo/demo.webm not found — demo step may have failed"
          fi

          if [ -n "$EMBED_URL" ]; then
            DEMO_SECTION="<video src=\"$EMBED_URL\" controls=\"controls\" muted=\"muted\" width=\"600\"></video>"
          elif [ -n "$FALLBACK_URL" ]; then
            DEMO_SECTION="_Inline preview unavailable — [download demo.webm]($FALLBACK_URL)_"
          elif [ -n "${{ steps.demo-artifact.outputs.artifact-url }}" ]; then
            DEMO_SECTION="_Video upload failed — [download .webm](${{ steps.demo-artifact.outputs.artifact-url }})_"
          else
            DEMO_SECTION="_Demo recording not available (demo step failed)._"
          fi

          COMMENT_BODY=$(cat <<EOF
## 🎥 Frontend Tests — ${BADGE}

**Branch:** \`${{ github.head_ref }}\` → \`main\`
**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

### 🎬 Demo Recording

${DEMO_SECTION}
EOF
)

          gh pr comment $PR_NUMBER --body "$COMMENT_BODY"

      - name: Post PR comment — test results and downloads
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build a row per recorded video
          VIDEO_ROWS=""
          while IFS= read -r video; do
            dir=$(basename "$(dirname "$video")")
            name="${dir%-chromium}"
            VIDEO_ROWS="${VIDEO_ROWS}| \`${name}\` |
          "
          done < <(find frontend/test-results -name "*.webm" 2>/dev/null | grep -v test-results/demo | sort)

          cat > /tmp/pr-comment-downloads.md <<COMMENT
          ### Recorded tests

          | Test |
          |------|
          ${VIDEO_ROWS}
          ### Downloads

          | Artifact | Link |
          |----------|------|
          | 🎬 Demo video (.webm) | [Download](${{ steps.demo-artifact.outputs.artifact-url }}) |
          | 📹 Individual videos (.webm) | [Download](${{ steps.videos.outputs.artifact-url }}) |
          | 📦 Recordings tarball | [Download](${{ steps.recordings.outputs.artifact-url }}) |
          | 📊 Playwright HTML report | [Download](${{ steps.playwright-report.outputs.artifact-url }}) |
          COMMENT

          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/pr-comment-downloads.md
