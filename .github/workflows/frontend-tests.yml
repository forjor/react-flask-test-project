name: Frontend Tests & Recordings

on:
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    name: Run frontend tests and capture recordings
    # Only run for PRs opened from test/* branches
    if: startsWith(github.head_ref, 'test/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # REQUIRED to create a release and upload the video asset
      pull-requests: write # Required to post the PR comment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project dependencies
        run: make install-frontend install-backend

      - name: Install Playwright browsers
        run: make install-playwright-browsers

      - name: Run frontend tests
        id: tests
        run: make test-frontend
        env:
          CI: true

      - name: Run demo
        if: always()
        id: demo
        run: make demo
        env:
          CI: true

      - name: Upload demo video and post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LOCAL_VIDEO_PATH="artifacts/demo/demo.webm"
          ASSET_NAME="pr-${PR_NUMBER}-demo.webm"
          RELEASE_TAG="automated-pr-assets"

          if [ ! -f "$LOCAL_VIDEO_PATH" ]; then
            echo "No demo video found, skipping PR comment."
            exit 0
          fi

          # Compress video for faster loading
          COMPRESSED="/tmp/${ASSET_NAME}"
          ffmpeg -i "$LOCAL_VIDEO_PATH" \
            -c:v libvpx-vp9 -b:v 600k \
            -c:a libopus -b:a 64k \
            -vf "scale=1280:-2" \
            "$COMPRESSED" 2>/dev/null \
            || cp "$LOCAL_VIDEO_PATH" "$COMPRESSED"

          # Upload to issue assets API — returns a user-attachments URL that renders inline in PR comments
          UPLOAD_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: video/webm" \
            "https://uploads.github.com/repos/$REPO/issues/$PR_NUMBER/assets?name=$ASSET_NAME" \
            --data-binary @"$COMPRESSED")
          VIDEO_URL=$(echo "$UPLOAD_RESPONSE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('asset_url',''))" 2>/dev/null || echo "")

          # Fallback: store in a dedicated prerelease used as a "storage locker"
          if [ -z "$VIDEO_URL" ]; then
            gh release view "$RELEASE_TAG" > /dev/null 2>&1 \
              || gh release create "$RELEASE_TAG" \
                   --title "Automated PR Assets" \
                   --notes "Storage locker for automated PR assets." \
                   --prerelease
            gh release upload "$RELEASE_TAG" "$COMPRESSED" --clobber
            VIDEO_URL="https://github.com/$REPO/releases/download/$RELEASE_TAG/$ASSET_NAME"
          fi

          # Status line
          if [ "$TESTS_OUTCOME" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="Tests passed"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="Tests failed"
          fi

          # Build and post comment with inline video
          {
            echo "## ${STATUS_ICON} Demo Recording — ${STATUS_TEXT}"
            echo ""
            echo "<video src=\"${VIDEO_URL}\" controls muted width=\"800\"></video>"
            echo ""
            echo "[Direct link](${VIDEO_URL}) &nbsp;|&nbsp; [Run #${RUN_NUMBER}](${RUN_URL})"
          } > /tmp/pr_comment.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/pr_comment.md
