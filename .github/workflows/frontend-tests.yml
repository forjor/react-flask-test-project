name: Frontend Tests & Recordings

on:
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    name: Run frontend tests and capture recordings
    # Only run for PRs opened from test/* branches
    if: startsWith(github.head_ref, 'test/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post the PR comment
      issues: write        # Required to upload issue assets (video/thumbnail)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project dependencies
        run: make install-frontend install-backend

      - name: Install Playwright browsers
        run: make install-playwright-browsers

      - name: Run frontend tests
        id: tests
        run: make test-frontend
        env:
          CI: true

      - name: Run demo
        if: always()
        id: demo
        run: make demo
        env:
          CI: true

      - name: Upload demo video and post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LOCAL_VIDEO_PATH="artifacts/demo/demo.webm"
          ASSET_NAME="pr-${PR_NUMBER}-demo.webm"

          if [ ! -f "$LOCAL_VIDEO_PATH" ]; then
            echo "No demo video found, skipping PR comment."
            exit 0
          fi

          # Compress video for faster loading
          COMPRESSED="/tmp/${ASSET_NAME}"
          ffmpeg -i "$LOCAL_VIDEO_PATH" \
            -c:v libvpx-vp9 -b:v 600k \
            -c:a libopus -b:a 64k \
            -vf "scale=1280:-2" \
            "$COMPRESSED" 2>/dev/null \
            || cp "$LOCAL_VIDEO_PATH" "$COMPRESSED"

          # Extract a thumbnail at 3 seconds for the clickable preview image
          THUMB_PATH="/tmp/pr-${PR_NUMBER}-thumbnail.jpg"
          ffmpeg -i "$COMPRESSED" -ss 00:00:03 -vframes 1 -q:v 2 "$THUMB_PATH" 2>/dev/null \
            || ffmpeg -i "$COMPRESSED" -vframes 1 -q:v 2 "$THUMB_PATH" 2>/dev/null

          upload_asset() {
            local file="$1" content_type="$2" name="$3"
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: $content_type" \
              "https://uploads.github.com/repos/$REPO/issues/$PR_NUMBER/assets?name=$name" \
              --data-binary @"$file"
          }

          echo "Uploading video..."
          VIDEO_RESP=$(upload_asset "$COMPRESSED" "video/webm" "$ASSET_NAME")
          echo "Video upload response: $VIDEO_RESP"
          VIDEO_URL=$(echo "$VIDEO_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('browser_download_url') or d.get('url') or '')" 2>/dev/null)
          echo "Video URL: $VIDEO_URL"

          THUMB_URL=""
          if [ -f "$THUMB_PATH" ]; then
            echo "Uploading thumbnail..."
            THUMB_RESP=$(upload_asset "$THUMB_PATH" "image/jpeg" "pr-${PR_NUMBER}-thumbnail.jpg")
            echo "Thumbnail upload response: $THUMB_RESP"
            THUMB_URL=$(echo "$THUMB_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('browser_download_url') or d.get('url') or '')" 2>/dev/null)
            echo "Thumbnail URL: $THUMB_URL"
          fi

          # Status line
          if [ "$TESTS_OUTCOME" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="Tests passed"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="Tests failed"
          fi

          # Build and post comment — thumbnail-link pattern (click image to open video).
          # GitHub strips <video> tags from PR comments, so this is the standard approach used
          # by Cypress, Playwright, and Replay.io for embedding recordings.
          {
            echo "## ${STATUS_ICON} Demo Recording — ${STATUS_TEXT}"
            echo ""
            if [ -n "$VIDEO_URL" ] && [ -n "$THUMB_URL" ]; then
              echo "[![Watch the demo](${THUMB_URL})](${VIDEO_URL})"
              echo ""
              echo "[Download video](${VIDEO_URL}) &nbsp;|&nbsp; [Run #${RUN_NUMBER}](${RUN_URL})"
            elif [ -n "$VIDEO_URL" ]; then
              echo "[Watch the demo recording](${VIDEO_URL})"
              echo ""
              echo "[Run #${RUN_NUMBER}](${RUN_URL})"
            else
              echo "> Video upload failed — see [Run #${RUN_NUMBER}](${RUN_URL}) for the recording artifact."
            fi
          } > /tmp/pr_comment.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/pr_comment.md
