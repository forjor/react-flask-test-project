name: Frontend Tests & Recordings

on:
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    name: Run frontend tests and capture recordings
    # Only run for PRs opened from test/* branches
    if: startsWith(github.head_ref, 'test/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post the PR comment
      contents: write      # Required to create/upload GitHub release assets for video hosting

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install project dependencies
        run: make install-frontend install-backend

      - name: Install Playwright browsers
        run: make install-playwright-browsers

      - name: Run frontend tests
        id: tests
        run: make test-frontend
        env:
          CI: true

      - name: Run demo
        if: always()
        id: demo
        run: make demo
        env:
          CI: true

      - name: Upload demo video and post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LOCAL_VIDEO_PATH="artifacts/demo/demo.webm"

          if [ ! -f "$LOCAL_VIDEO_PATH" ]; then
            echo "No demo video found, skipping PR comment."
            exit 0
          fi

          TAG="demo-pr-${PR_NUMBER}"
          VIDEO_FILE="demo.mp4"
          THUMB_FILE="demo-thumbnail.jpg"
          COMPRESSED="/tmp/$VIDEO_FILE"
          THUMB_PATH="/tmp/$THUMB_FILE"

          # Convert to H.264/mp4 — broader browser support and accepted by GitHub release assets
          echo "Converting video to mp4..."
          ffmpeg -i "$LOCAL_VIDEO_PATH" \
            -c:v libx264 -b:v 600k \
            -c:a aac -b:a 64k \
            -vf "scale=1280:-2" \
            -pix_fmt yuv420p \
            -movflags +faststart \
            "$COMPRESSED" \
            || { echo "ffmpeg failed, using original"; cp "$LOCAL_VIDEO_PATH" "$COMPRESSED"; }

          # Extract thumbnail at 3 seconds for the clickable preview image
          echo "Extracting thumbnail..."
          ffmpeg -i "$COMPRESSED" -ss 00:00:03 -vframes 1 -q:v 2 "$THUMB_PATH" \
            || ffmpeg -i "$COMPRESSED" -vframes 1 -q:v 2 "$THUMB_PATH" \
            || true

          # Create or update a pre-release for this PR — used as stable video hosting.
          # Release assets have guaranteed public browser_download_url, unlike issue assets.
          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --repo "$REPO" \
            --prerelease \
            --title "Demo — PR #${PR_NUMBER}" \
            --notes "Auto-generated demo recording. Updated on each push to the PR." \
            2>&1 || true

          # Upload video (--clobber replaces any asset from a previous push to this PR)
          echo "Uploading video..."
          if gh release upload "$TAG" "$COMPRESSED" --repo "$REPO" --clobber 2>&1; then
            VIDEO_URL="https://github.com/$REPO/releases/download/$TAG/$VIDEO_FILE"
          else
            VIDEO_URL=""
          fi
          echo "Video URL: $VIDEO_URL"

          # Upload thumbnail
          THUMB_URL=""
          if [ -f "$THUMB_PATH" ]; then
            echo "Uploading thumbnail..."
            if gh release upload "$TAG" "$THUMB_PATH" --repo "$REPO" --clobber 2>&1; then
              THUMB_URL="https://github.com/$REPO/releases/download/$TAG/$THUMB_FILE"
            fi
            echo "Thumbnail URL: $THUMB_URL"
          fi

          # Status line
          if [ "$TESTS_OUTCOME" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="Tests passed"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="Tests failed"
          fi

          # Build and post comment — thumbnail-link pattern (click image to open video).
          # GitHub strips <video> tags from PR comments, so this is the standard approach used
          # by Cypress, Playwright, and Replay.io for embedding recordings.
          {
            echo "## ${STATUS_ICON} Demo Recording — ${STATUS_TEXT}"
            echo ""
            if [ -n "$VIDEO_URL" ] && [ -n "$THUMB_URL" ]; then
              echo "[![Watch the demo](${THUMB_URL})](${VIDEO_URL})"
              echo ""
              echo "[Download video](${VIDEO_URL}) &nbsp;|&nbsp; [Run #${RUN_NUMBER}](${RUN_URL})"
            elif [ -n "$VIDEO_URL" ]; then
              echo "[Watch the demo recording](${VIDEO_URL})"
              echo ""
              echo "[Run #${RUN_NUMBER}](${RUN_URL})"
            else
              echo "> Video upload failed — see [Run #${RUN_NUMBER}](${RUN_URL}) for the recording artifact."
            fi
          } > /tmp/pr_comment.md

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/pr_comment.md
